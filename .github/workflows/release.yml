name: Release

on:
  # Package candidates deliberately; ordinary pushes use the code checks.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # Install the native dependency with its supported Node version first.
      # Tests mock that addon and use Node's SQLite snapshot API (26.1+).
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
      - run: npx vitest run

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot
      - run: npm ci
      - name: Build candidate
        run: npm run make
        env:
          SKIP_FUSES: '1'
      - run: node scripts/generate-update-yml.js
      - name: Reject GitHub tokens in distributable files
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          // Inspect unpacked bundles too: compressed ZIP/installer bytes alone
          // cannot prove that their app.asar payload is free of credentials.
          const roots = ['.webpack', 'out'].map((entry) => path.resolve(entry));
          const tokenPattern = /(?:gh[pousr]|github_pat)_[A-Za-z0-9_]{20,}/;
          if (process.env.GH_TOKEN || process.env.UPDATE_TOKEN) {
            console.error('Build scan refuses to run with an update token in its environment.');
            process.exit(1);
          }
          const files = [];
          const visit = (directory) => {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const file = path.join(directory, entry.name);
              if (entry.isDirectory()) visit(file);
              else files.push(file);
            }
          };
          for (const root of roots) if (fs.existsSync(root)) visit(root);
          const matches = files.filter((file) => tokenPattern.test(fs.readFileSync(file, 'latin1')));
          if (matches.length) {
            console.error(`Potential GitHub token found in: ${matches.map((file) => path.relative(process.cwd(), file)).join(', ')}`);
            process.exit(1);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: out/make/**
          if-no-files-found: error
          # Only needed within this run; published files live in the release.
          retention-days: 1

# Publishing and retained Mac-feed reuse are intentionally absent. The prior
# baseline installers were withdrawn; native upgrade tests need a clean
# baseline before publishing is restored. The prior path fetched an old Mac binary with a GitHub token and could publish a mixed
# release. Restore those jobs only after a newly built, signed Mac package and
# its native update path have been validated.
