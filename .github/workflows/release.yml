name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install build deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      - name: Install dependencies
        run: npm ci

      - name: Test update manifest generation
        run: npx vitest run scripts/__tests__/updateManifest.test.ts

      - name: Build artifacts
        run: ${{ runner.os == 'Windows' && 'set SKIP_FUSES=1 && npm run make' || 'SKIP_FUSES=1 npm run make' }}
        env:
          GH_TOKEN: ${{ secrets.UPDATE_TOKEN }}

      - name: Generate update yml
        run: node scripts/generate-update-yml.js

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/make/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
